[global]
disable = ["MD034"]
respect-gitignore = true
# Hidden files and directories, and the home-manager submodule, which is its own repository and lints itself.
exclude = [".*", "modules/serverbase/home-manager"]

[MD013]
line-length = 120
code-blocks = false
# A table row cannot be wrapped: a line break inside one ends the row. Either the cells stay short enough to satisfy
# the limit, which decides content by column width, or the rule is off for tables. It is off.
tables = false

[MD046]
style = "fenced"
